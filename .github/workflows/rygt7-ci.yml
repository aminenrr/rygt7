name: RyGT7 CI package
run-name: RyGT7 CI build (${{ github.ref_name }})
# Fork branch ui-hires-precompile: builds this fork's source with the renderer from
# aminenrr/shadgt7 branch ui-hires-precompile (FORK_* below; the official repositories otherwise).
on:
  push:
    branches: [main, ui-hires-precompile, round2]
  workflow_call:
    inputs:
      renderer_sha:
        type: string
        required: false
        default: ''
      source_sha:
        type: string
        required: false
        default: ''
      force:
        type: boolean
        required: false
        default: false
    secrets:
      GITLAB_PACKAGE_TOKEN:
        required: false # Compatibility with existing renderer callers; unused.
      CODESIGN_PFX_BASE64:
        required: false
      CODESIGN_PFX_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      force:
        description: Compatibility input; all requested runs build
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/rygt7-ci.yml
      - ci/rygt7/**
permissions:
  contents: read
env:
  FORK_SOURCE_REPO: aminenrr/rygt7
  FORK_RENDERER_REPO: aminenrr/shadgt7
  FORK_RENDERER_BRANCH: ${{ github.ref_name == 'round2' && 'round2' || 'ui-hires-precompile' }}
concurrency:
  group: rygt7-main-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      controller_commit: ${{ steps.controller.outputs.commit }}
      commit: ${{ steps.source.outputs.commit }}
      renderer_commit: ${{ steps.source.outputs.renderer_commit }}
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.FORK_SOURCE_REPO }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Select exact GitHub runtime revision
        id: controller
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test trusted build and package controls
        run: |
          python3 -m unittest discover -s ci/rygt7 -p 'test_*.py'
          python3 -m unittest discover -s ci/rygt7/tests -p 'test_*.py'
      - name: Resolve exact RyGT7 main revision
        if: github.event_name != 'pull_request'
        id: source
        env:
          SOURCE_OVERRIDE_SHA: ${{ steps.controller.outputs.commit }}
          RENDERER_OVERRIDE_SHA: ${{ inputs.renderer_sha }}
          FORCE_BUILD: ${{ github.event_name == 'pull_request' || inputs.force }}
          RYGT7_SOURCE_REPO: ${{ env.FORK_SOURCE_REPO }}
          RYGT7_RENDERER_REPO: ${{ env.FORK_RENDERER_REPO }}
        run: |
          set -euo pipefail
          # The fork's renderer branch head, resolved once here (registry_ci resolves main or a SHA).
          if [ -z "${RENDERER_OVERRIDE_SHA}" ]; then
            RENDERER_OVERRIDE_SHA="$(git ls-remote "https://github.com/${RYGT7_RENDERER_REPO}.git" "refs/heads/${FORK_RENDERER_BRANCH}" | cut -f1)"
            [[ "$RENDERER_OVERRIDE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Renderer branch ${FORK_RENDERER_BRANCH} not found"; exit 1; }
            export RENDERER_OVERRIDE_SHA
          fi
          python3 ci/rygt7/registry_ci.py resolve
  tests:
    needs: source
    if: needs.source.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ needs.source.outputs.commit }}
      RENDERER_SHA: ${{ needs.source.outputs.renderer_commit }}
    steps:
      - name: Fetch exact public RyGT7 source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source remote add origin "https://github.com/${FORK_SOURCE_REPO}.git"
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Build and test converter
        working-directory: source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
          cmake --preset linux-release-cli
          cmake --build --preset linux-release-cli --parallel 2
          ctest --test-dir build/linux-release-cli --output-on-failure --no-tests=error --output-junit "$GITHUB_WORKSPACE/rygt7-converter-tests.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rygt7-converter-tests-${{ needs.source.outputs.commit }}
          path: rygt7-converter-tests.xml
          if-no-files-found: warn
          retention-days: 7
  windows:
    needs: [source, tests]
    if: needs.source.outputs.needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ needs.source.outputs.commit }}
      RENDERER_SHA: ${{ needs.source.outputs.renderer_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.FORK_SOURCE_REPO }}
          ref: ${{ needs.source.outputs.controller_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys2
        with:
          msystem: UCRT64
          location: C:/msys64
          update: true
          cache: false
          # FEAT-GTS-252: only MSYS2's Unix tools; the runtime compiler is the pinned GCC from
          # ci/rygt7/runtime-toolchain.json, not whatever MSYS2 ships on the day.
          install: >-
            base-devel git
      - name: Fetch exact public RyGT7 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA' }
          New-Item -ItemType Directory -Path C:/rygt7-ci/source -Force | Out-Null
          git -C C:/rygt7-ci/source init
          if ($LASTEXITCODE) { throw 'git init failed' }
          git -C C:/rygt7-ci/source config core.longpaths true
          git -C C:/rygt7-ci/source remote add origin "https://github.com/$($env:FORK_SOURCE_REPO).git"
          if ($LASTEXITCODE) { throw 'git remote failed' }
          git -C C:/rygt7-ci/source fetch --depth=1 origin $env:SOURCE_SHA
          if ($LASTEXITCODE) { throw 'GitHub fetch failed' }
          git -C C:/rygt7-ci/source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -or (git -C C:/rygt7-ci/source rev-parse HEAD) -cne $env:SOURCE_SHA) { throw 'Source mismatch' }
      - name: Build and package RyGT7 client
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          RYGT_CODESIGN: '1'
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./ci/rygt7/setup-tools.ps1
          $env:RYGT7_SOURCE_REPO = $env:FORK_SOURCE_REPO
          $env:RYGT7_RENDERER_REPO = $env:FORK_RENDERER_REPO
          $env:RYGT7_RENDERER_BRANCH = $env:FORK_RENDERER_BRANCH
          & ./ci/rygt7/build-windows.ps1 -SourceRoot C:/rygt7-ci/source -SourceSha $env:SOURCE_SHA -RendererSha $env:RENDERER_SHA -OutputRoot C:/rygt7-ci/build -MsysRoot $env:MSYS2_ROOT
          $env:GT7_SOURCE_ROOT = 'C:/rygt7-ci/source'
          $env:GT7_RENDERER_ROOT = 'C:/rygt7-ci/build/renderer-source'
          # The controller's own tests expect the official repositories.
          Remove-Item Env:RYGT7_SOURCE_REPO, Env:RYGT7_RENDERER_REPO, Env:RYGT7_RENDERER_BRANCH
          python -m unittest discover -s ci/rygt7 -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Build adapter regression tests failed' }
          python -m unittest discover -s ci/rygt7/tests -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Package controller regression tests failed' }
          $env:ARTIFACT_DIR = 'C:/rygt7-ci/build/dist'
          $env:RYGT7_SOURCE_REPO = $env:FORK_SOURCE_REPO
          $env:RYGT7_RENDERER_REPO = $env:FORK_RENDERER_REPO
          python ci/rygt7/registry_ci.py validate
          if ($LASTEXITCODE) { throw 'Windows package validation failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rygt7-windows-${{ needs.source.outputs.commit }}-renderer-${{ needs.source.outputs.renderer_commit }}
          path: C:/rygt7-ci/build/dist/
          if-no-files-found: error
          retention-days: 7
  package:
    needs: [source, tests, windows]
    runs-on: ubuntu-24.04
    env:
      SOURCE_SHA: ${{ needs.source.outputs.commit }}
      RENDERER_SHA: ${{ needs.source.outputs.renderer_commit }}
      ARTIFACT_DIR: dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.FORK_SOURCE_REPO }}
          ref: ${{ needs.source.outputs.controller_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rygt7-windows-${{ needs.source.outputs.commit }}-renderer-${{ needs.source.outputs.renderer_commit }}
          path: dist/
      - name: Independently validate package and provenance
        env:
          RYGT7_SOURCE_REPO: ${{ env.FORK_SOURCE_REPO }}
          RYGT7_RENDERER_REPO: ${{ env.FORK_RENDERER_REPO }}
        run: python3 ci/rygt7/registry_ci.py validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: package_artifact
        with:
          name: rygt7-ci-${{ needs.source.outputs.commit }}-renderer-${{ needs.source.outputs.renderer_commit }}
          path: |
            dist/RyGT7-ci-*.zip
            dist/RyGT7-ci-*.zip.sha256
            dist/CI-BUILD.json
          if-no-files-found: error
          retention-days: 7
      - name: Summarize verified artifact
        env:
          ARTIFACT_URL: ${{ steps.package_artifact.outputs.artifact-url }}
        run: |
          {
            echo '### Verified CI artifact'
            echo
            echo "Source: [\`$SOURCE_SHA\`](https://github.com/$FORK_SOURCE_REPO/commit/$SOURCE_SHA)"
            echo
            echo "Renderer: [\`$RENDERER_SHA\`](https://github.com/$FORK_RENDERER_REPO/commit/$RENDERER_SHA)"
            echo
            echo "[Download artifact]($ARTIFACT_URL)"
            echo
            echo "SHA-256: \`$(cut -d ' ' -f 1 dist/RyGT7-ci-*.zip.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
